<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合规知识图谱 · 法规×文档×阶段</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f4f8;color:#1a202c;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:16px;font-weight:700;white-space:nowrap}
header .back{background:rgba(255,255,255,.18);border-radius:12px;padding:4px 12px;font-size:12px;cursor:pointer;color:#fff;text-decoration:none;white-space:nowrap}
header .back:hover{background:rgba(255,255,255,.28)}
#hstats{margin-left:auto;font-size:11px;opacity:.85;white-space:nowrap}
.tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 20px;flex-shrink:0}
.tab{padding:12px 18px;font-size:13px;font-weight:600;color:#718096;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#2b6cb0;border-bottom-color:#2b6cb0}
.tab:hover:not(.active){color:#4a5568}
.toolbar{padding:10px 20px;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0;display:flex;align-items:center;gap:10px}
.toolbar input{flex:1;max-width:420px;border:1px solid #cbd5e0;border-radius:8px;padding:7px 12px;font-size:13px;outline:none}
.toolbar input:focus{border-color:#3182ce}
.toolbar .hint{font-size:11px;color:#a0aec0}
.body{flex:1;overflow-y:auto;padding:16px 20px}
/* 阶段视图 */
.stage-block{background:#fff;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.stage-hd{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-left:4px solid #ccc}
.stage-hd .no{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.stage-hd h3{font-size:14px;font-weight:700;color:#1a365d}
.stage-hd .meta{font-size:11px;color:#a0aec0;margin-left:auto}
.stage-body{padding:0 16px 12px;display:none}
.stage-body.open{display:block}
.row{display:grid;grid-template-columns:1.4fr 1fr 1.4fr auto;gap:10px;padding:9px 10px;border-top:1px solid #edf2f7;font-size:12px;align-items:center}
.row:hover{background:#f7fafc}
.row .col-lab{font-size:10px;color:#a0aec0;display:block;margin-bottom:2px}
.row .doc{font-weight:600;color:#2c5282}
.row .act{color:#4a5568}
.row .basis{color:#718096;line-height:1.4}
.row .clause{color:#a0aec0;font-size:11px}
.gen-btn{background:#3182ce;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;white-space:nowrap}
.gen-btn:hover{background:#2b6cb0}
.gen-btn.none{background:#edf2f7;color:#a0aec0;cursor:default}
.rowhead{font-size:10px;color:#a0aec0;font-weight:600;padding:6px 10px;display:grid;grid-template-columns:1.4fr 1fr 1.4fr auto;gap:10px;border-bottom:1px solid #e2e8f0}
/* 法规/文档列表卡片 */
.card{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
.card-hd{padding:11px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.card-hd:hover{background:#f7fafc}
.card-hd .ic{font-size:16px;flex-shrink:0}
.card-hd .main{flex:1;min-width:0}
.card-hd .t{font-size:13px;font-weight:700;color:#2d3748;line-height:1.35}
.card-hd .s{font-size:11px;color:#a0aec0;margin-top:2px}
.card-hd .badge{font-size:10px;background:#bee3f8;color:#2b6cb0;border-radius:10px;padding:1px 8px;flex-shrink:0;white-space:nowrap}
.card-body{display:none;padding:0 14px 12px 40px}
.card-body.open{display:block}
.link-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed #edf2f7;font-size:12px}
.link-item .stage-pill{font-size:10px;border-radius:8px;padding:1px 7px;color:#fff;flex-shrink:0}
.link-item .lname{flex:1;color:#4a5568}
.link-item .lname b{color:#2c5282}
.empty{text-align:center;color:#a0aec0;font-size:13px;padding:40px}
/* modal 生成 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:92%;max-width:760px;height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-head h2{font-size:15px;font-weight:700;color:#1a365d;flex:1}
.modal-out{flex:1;overflow-y:auto;padding:18px 20px;background:#fafbfc}
.doc-content{background:#fff;border-radius:10px;padding:22px;box-shadow:0 1px 4px rgba(0,0,0,.06);min-height:120px;font-size:13px;line-height:1.7}
.doc-content.streaming{border-left:3px solid #3182ce}
.doc-content h1{font-size:1.3em;color:#1a365d;margin:1em 0 .5em;padding-bottom:.3em;border-bottom:2px solid #e2e8f0}
.doc-content h2{font-size:1.1em;color:#2b6cb0;margin:.9em 0 .4em}
.doc-content h3{font-size:1em;color:#2d3748;margin:.7em 0 .3em}
.doc-content p{margin:.5em 0}.doc-content ul,.doc-content ol{padding-left:1.5em;margin:.5em 0}
.doc-content table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.9em}
.doc-content th,.doc-content td{border:1px solid #e2e8f0;padding:6px 10px;text-align:left}
.doc-content th{background:#f7fafc;font-weight:600}
.icon-btn{background:none;border:1px solid #e2e8f0;border-radius:7px;padding:6px 14px;font-size:12px;cursor:pointer;color:#4a5568}
.icon-btn:hover{border-color:#3182ce;color:#3182ce}
.icon-btn:disabled{opacity:.5;cursor:not-allowed}
/* 图谱视图 */
.graph-wrap{position:relative;width:100%;height:100%}
#graphCanvas{width:100%;height:100%;background:radial-gradient(circle at 50% 40%,#0f1b2d 0%,#0a1422 70%,#070d18 100%)}
.graph-legend{position:absolute;top:14px;left:14px;background:rgba(15,27,45,.82);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;font-size:11px;color:#cbd5e0;backdrop-filter:blur(6px)}
.graph-legend .lg{display:flex;align-items:center;gap:7px;margin:4px 0}
.graph-legend .dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 6px currentColor}
.graph-hint{position:absolute;bottom:14px;left:14px;font-size:11px;color:#64748b;background:rgba(15,27,45,.6);padding:5px 10px;border-radius:8px}
.node-panel{position:absolute;top:14px;right:14px;width:300px;max-height:calc(100% - 28px);overflow-y:auto;background:rgba(17,28,46,.95);border:1px solid rgba(120,160,220,.25);border-radius:12px;padding:14px;color:#e2e8f0;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);display:none}
.node-panel.show{display:block}
.node-panel .np-type{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#7dd3fc;font-weight:700}
.node-panel .np-title{font-size:14px;font-weight:700;color:#fff;margin:4px 0 8px;line-height:1.4}
.node-panel .np-sub{font-size:11px;color:#94a3b8;margin-bottom:10px;line-height:1.5}
.node-panel .np-sec{font-size:10px;color:#64748b;font-weight:700;margin:10px 0 5px;text-transform:uppercase}
.np-nb{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:.12s;margin-bottom:3px}
.np-nb:hover{background:rgba(120,160,220,.16)}
.np-nb .nb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.np-nb .nb-lab{flex:1;color:#cbd5e0;line-height:1.35}
.np-nb .nb-rel{font-size:9px;color:#64748b}
.req-group{margin-top:4px}
.req-group-hd{font-size:11px;color:#cbd5e0;cursor:pointer;padding:5px 6px;border-radius:6px;background:rgba(120,160,220,.08)}
.req-group-hd:hover{background:rgba(120,160,220,.16)}
.req-group-body{padding-left:6px}
.np-gen{width:100%;margin-top:10px;background:#3182ce;color:#fff;border:none;border-radius:8px;padding:8px;font-size:12px;cursor:pointer;font-weight:600}
.np-gen:hover{background:#2b6cb0}
.np-close{position:absolute;top:10px;right:12px;cursor:pointer;color:#64748b;font-size:16px}
.np-close:hover{color:#fff}
.graph-search{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5}
.graph-search input{width:320px;background:rgba(17,28,46,.92);border:1px solid rgba(120,160,220,.3);border-radius:20px;padding:8px 16px;font-size:13px;color:#fff;outline:none}
.graph-search input::placeholder{color:#64748b}
.graph-search input:focus{border-color:#3182ce;box-shadow:0 0 0 3px rgba(49,130,206,.2)}
.gs-results{margin-top:6px;background:rgba(17,28,46,.97);border:1px solid rgba(120,160,220,.25);border-radius:10px;max-height:300px;overflow-y:auto;display:none}
.gs-results.show{display:block}
.gs-item{padding:8px 14px;font-size:12px;color:#cbd5e0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.gs-item:hover{background:rgba(120,160,220,.16)}
.gs-item .gi-type{font-size:9px;color:#7dd3fc;margin-right:6px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2d3748;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
::-webkit-scrollbar{width:14px;height:14px}::-webkit-scrollbar-track{background:#f0f4f8}::-webkit-scrollbar-thumb{background:#a0aec0;border-radius:7px;border:3px solid #f0f4f8;background-clip:padding-box;min-height:40px}::-webkit-scrollbar-thumb:hover{background:#718096}*{scrollbar-width:auto;scrollbar-color:#a0aec0 #f0f4f8}
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
  <h1>合规知识图谱</h1>
  <a class="back" href="/">← 返回主页</a>
  <span id="hstats"></span>
</header>

<div class="tabs">
  <div class="tab active" data-view="graph" onclick="switchView('graph')">🌐 图谱视图</div>
  <div class="tab" data-view="stage" onclick="switchView('stage')">按注册阶段</div>
  <div class="tab" data-view="requirement" onclick="switchView('requirement')">按法规要求</div>
  <div class="tab" data-view="document" onclick="switchView('document')">按文档/证据</div>
</div>

<div class="toolbar" id="toolbar">
  <input id="searchBox" placeholder="搜索法规名 / 条款 / 文档关键词…" oninput="onSearch()">
  <span class="hint" id="viewHint"></span>
</div>

<!-- 列表视图 -->
<div class="body" id="body" style="display:none"><div class="empty">加载中…</div></div>

<!-- 图谱视图 -->
<div class="graph-wrap" id="graphWrap">
  <div class="graph-search">
    <input id="graphSearch" placeholder="🔍 搜索节点（法规 / 文档 / 阶段）…" oninput="onGraphSearch()" autocomplete="off">
    <div class="gs-results" id="gsResults"></div>
  </div>
  <div id="graphCanvas"></div>
  <div class="graph-legend">
    <div class="lg"><span class="dot" style="background:#f6ad55;color:#f6ad55"></span>注册阶段 Stage</div>
    <div class="lg"><span class="dot" style="background:#4fd1c5;color:#4fd1c5"></span>文档/证据 Document</div>
    <div class="lg"><span class="dot" style="background:#90cdf4;color:#90cdf4"></span>法规要求 Requirement</div>
    <div class="lg"><span class="dot" style="background:#f687b3;color:#f687b3"></span>法规文件 Regulation</div>
    <div class="lg"><span class="dot" style="background:#b794f4;color:#b794f4"></span>归档档案 Dossier</div>
  </div>
  <div class="graph-hint">单击节点查看详情并高亮关联 · 双击聚焦 · 滚轮缩放 · 拖拽平移</div>
  <div class="node-panel" id="nodePanel">
    <span class="np-close" onclick="closePanel()">✕</span>
    <div class="np-type" id="npType"></div>
    <div class="np-title" id="npTitle"></div>
    <div class="np-sub" id="npSub"></div>
    <div id="npGenWrap"></div>
    <div class="np-sec">关联节点（点击跳转）</div>
    <div id="npNeighbors"></div>
  </div>
</div>

<!-- 生成 modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">生成文档</h2>
      <button class="icon-btn" id="mDownload" onclick="downloadDoc()" style="display:none">⬇️ 下载 Word</button>
      <button class="icon-btn" onclick="closeModal()">✕ 关闭</button>
    </div>
    <div class="modal-out"><div class="doc-content" id="modalOut"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Auth：复用主页登录态，给所有 /api 请求自动带头 ──
let SESSION_TOKEN = localStorage.getItem('qms_token') || '';
const _origFetch = window.fetch.bind(window);
window.fetch = (url, opts={}) => {
  const isApi = typeof url === 'string' && url.startsWith('/api');
  if (isApi && SESSION_TOKEN) {
    opts.headers = { ...(opts.headers||{}), 'Authorization': 'Bearer ' + SESSION_TOKEN };
  }
  return _origFetch(url, opts).then(r => {
    if (isApi && r.status === 401) { alert('登录已失效，请在主页重新登录'); location.href='/'; }
    return r;
  });
};

let GRAPH=null, CHECKLIST=null, curView='graph', curDocId=null, streaming=false;
let network=null, visNodes=null, visEdges=null, fullGraphData=null, allNodesIndex=[];

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const stageColor={};

async function init(){
  if (!SESSION_TOKEN){ alert('请先在主页登录'); location.href='/'; return; }
  try{
    const [ov,cl]=await Promise.all([
      fetch('/api/compliance/overview').then(r=>r.json()),
      fetch('/api/compliance/checklist').then(r=>r.json()),
    ]);
    GRAPH=ov; CHECKLIST=cl;
    ov.stages.forEach(s=>stageColor[s.key]=s.color);
    const st=ov.stats;
    document.getElementById('hstats').textContent=
      `${st.nodes||0} 节点 · ${st.edges||0} 关系 · ${st.requirements} 法规要求 · ${st.documents} 文档`;
    // 默认进图谱视图
    switchView('graph');
  }catch(e){ document.getElementById('body').innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`; }
}

function switchView(v){
  curView=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  const isGraph=v==='graph';
  document.getElementById('graphWrap').style.display=isGraph?'block':'none';
  document.getElementById('toolbar').style.display=isGraph?'none':'flex';
  document.getElementById('body').style.display=isGraph?'none':'block';
  if(isGraph){ if(!network) initGraph(); else network.redraw(); return; }
  document.getElementById('searchBox').value='';
  render();
}

const HINTS={stage:'点击阶段展开该阶段要产出的文档与对应法规要求',
  requirement:'点击法规要求，查看由哪些文档在哪些阶段满足',
  document:'点击文档，查看它满足哪些法规要求、属于哪些阶段'};

function render(){
  document.getElementById('viewHint').textContent=HINTS[curView]||'';
  if(curView==='stage') renderStage();
  else if(curView==='requirement') renderRequirement();
  else renderDocument();
}

function genBtnHtml(docId, label){
  if(docId) return `<button class="gen-btn" onclick="genDoc('${docId}',event)">📄 可生成</button>`;
  return `<span class="gen-btn none" title="暂无模板">清单项</span>`;
}

// ── 按阶段 ──
function renderStage(){
  const kw=(document.getElementById('searchBox').value||'').trim();
  const body=document.getElementById('body');
  body.innerHTML=CHECKLIST.stages.map(s=>{
    let items=s.items;
    if(kw) items=items.filter(i=>(i.activity+i.output+i.basis+i.clause+i.sub).includes(kw));
    if(!items.length) return '';
    const rows=items.map(i=>`
      <div class="row">
        <div><span class="col-lab">${esc(i.sub)} · 输出文档</span><span class="doc">${esc(i.output)}</span></div>
        <div><span class="col-lab">活动</span><span class="act">${esc(i.activity)}</span></div>
        <div><span class="col-lab">满足法规要求</span><span class="basis">${esc(i.basis)}</span><br><span class="clause">${esc(i.clause)}</span></div>
        <div>${genBtnHtml(i.doc_id)}</div>
      </div>`).join('');
    return `<div class="stage-block">
      <div class="stage-hd" style="border-left-color:${s.color}" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="no" style="background:${s.color}">${s.no}</span>
        <h3>${esc(s.name)}</h3>
        <span class="meta">${items.length} 项</span>
      </div>
      <div class="stage-body ${kw?'open':''}">
        <div class="rowhead"><span>输出文档</span><span>活动</span><span>满足法规要求</span><span></span></div>
        ${rows}
      </div></div>`;
  }).join('')||'<div class="empty">无匹配项</div>';
}

// ── 按法规要求 ──
async function renderRequirement(){
  const kw=(document.getElementById('searchBox').value||'').trim();
  const body=document.getElementById('body');
  // 用 search 接口（空关键词时本地汇总所有 requirement）
  let results;
  if(kw){
    results=(await fetch('/api/compliance/search?q='+encodeURIComponent(kw)).then(r=>r.json())).results;
  }else{
    results=(await fetch('/api/compliance/search?q='+encodeURIComponent('')).then(r=>r.json())).results||[];
    if(!results.length) results=allRequirementsFromChecklist();
  }
  if(!results.length){ body.innerHTML='<div class="empty">无匹配法规要求</div>'; return; }
  body.innerHTML=results.map(r=>`
    <div class="card">
      <div class="card-hd" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="ic">📋</span>
        <div class="main"><div class="t">${esc(r.basis)}</div><div class="s">${esc(r.clause)}</div></div>
        <span class="badge">${r.docs.length} 份文档满足</span>
      </div>
      <div class="card-body">
        ${r.docs.map(d=>`<div class="link-item">
          <span class="stage-pill" style="background:${stageColor[d.stage]||'#888'}">${stageNo(d.stage)}</span>
          <span class="lname"><b>${esc(d.doc_name)}</b></span>
          ${d.doc_id?`<button class="gen-btn" onclick="genDoc('${d.doc_id}',event)">📄 可生成</button>`:'<span class="gen-btn none">清单项</span>'}
        </div>`).join('')}
      </div></div>`).join('');
}

// 本地从 checklist 汇总法规要求（search 空查询兜底）
function allRequirementsFromChecklist(){
  const map={};
  CHECKLIST.stages.forEach(s=>s.items.forEach(i=>{
    const k=i.basis+'|'+i.clause;
    if(!map[k]) map[k]={basis:i.basis,clause:i.clause,docs:[]};
    map[k].docs.push({doc_name:i.output,doc_id:i.doc_id,stage:i.stage});
  }));
  return Object.values(map);
}

// ── 按文档 ──
function renderDocument(){
  const kw=(document.getElementById('searchBox').value||'').trim();
  const body=document.getElementById('body');
  // 汇总所有文档（按 output 名聚合，记录其满足的法规与阶段）
  const map={};
  CHECKLIST.stages.forEach(s=>s.items.forEach(i=>{
    const k=i.doc_id||('item-'+i.seq);
    if(!map[k]) map[k]={name:i.output,doc_id:i.doc_id,reqs:[],stages:new Set()};
    map[k].reqs.push({basis:i.basis,clause:i.clause});
    map[k].stages.add(i.stage);
  }));
  let docs=Object.values(map);
  if(kw) docs=docs.filter(d=>(d.name+d.reqs.map(r=>r.basis+r.clause).join('')).includes(kw));
  if(!docs.length){ body.innerHTML='<div class="empty">无匹配文档</div>'; return; }
  body.innerHTML=docs.map(d=>`
    <div class="card">
      <div class="card-hd" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="ic">📄</span>
        <div class="main"><div class="t">${esc(d.name)}</div>
          <div class="s">${[...d.stages].map(stageNo).join(' / ')} 阶段 · 满足 ${d.reqs.length} 条法规要求</div></div>
        ${d.doc_id?`<button class="gen-btn" onclick="genDoc('${d.doc_id}',event)">📄 可生成</button>`:'<span class="badge">清单项</span>'}
      </div>

        ${d.reqs.map(r=>`<div class="link-item">
          <span class="ic">📋</span><span class="lname"><b>${esc(r.basis)}</b> — ${esc(r.clause)}</span>
        </div>`).join('')}
      </div></div>`).join('');
}

async function streamSection(docId,section,outline,el,label){
  el.classList.add('streaming');
  let full=''; let done=false;
  const resp=await fetch('/api/generate/stream',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({doc_id:docId,section:section||undefined,outline:outline||undefined})});
  if(!resp.ok||!resp.body) throw new Error('HTTP '+resp.status);
  const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='';
  while(!done){
    const {value,done:rd}=await reader.read(); if(rd) break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop();
    for(const line of lines){
      if(!line.startsWith('data: ')) continue;
      const raw=line.slice(6);
      if(raw==='[DONE]'){ done=true; break; }
      let ev; try{ ev=JSON.parse(raw); }catch{ continue; }
      if(ev.type==='delta'){ full+=ev.content; el.innerHTML=marked.parse(full); el.dataset.md=full; el.scrollIntoView({block:'nearest'}); }
      else if(ev.type==='error'){ done=true; el.innerHTML=marked.parse(full)+`<div style="color:#e53e3e">⚠️ ${esc(ev.message||'')}</div>`; }
    }
  }
  el.classList.remove('streaming');
}

function collectMd(){
  const secs=document.querySelectorAll('#modalOut .doc-section, #modalOut > div');
  const parts=[];
  document.querySelectorAll('#modalOut [data-md]').forEach(e=>{ if(e.dataset.md) parts.push(e.dataset.md); });
  return parts.join('\n\n')||document.getElementById('modalOut').innerText;
}

async function downloadDoc(){
  const md=collectMd(); if(!md.trim()){ toast('暂无内容'); return; }
  const btn=document.getElementById('mDownload'); btn.disabled=true; const old=btn.textContent; btn.textContent='⏳…';
  try{
    const resp=await fetch('/api/generate/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({doc_id:curDocId,content:md})});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const blob=await resp.blob(); const cd=resp.headers.get('Content-Disposition')||'';
    let fn=(curDocId||'文档')+'.docx'; const m=cd.match(/filename\*=UTF-8''([^;]+)/); if(m){try{fn=decodeURIComponent(m[1]);}catch{}}
    const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
    toast('✓ 已下载');
  }catch(e){ toast('下载失败：'+e.message); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

// ══ 力导向图谱可视化 ══════════════════════════════════════════════════════
const TYPE_STYLE={
  Stage:      {color:'#f6ad55', size:30, shape:'dot'},
  Document:   {color:'#4fd1c5', size:18, shape:'dot'},
  Requirement:{color:'#90cdf4', size:14, shape:'dot'},
  Regulation: {color:'#f687b3', size:22, shape:'dot'},
  Dossier:    {color:'#b794f4', size:26, shape:'dot'},
};
const REL_COLOR={PRODUCES:'#f6ad55',SATISFIES:'#63b3ed',CITES:'#f687b3',BELONGS_TO:'rgba(255,255,255,0.06)',ARCHIVED_IN:'#b794f4'};

// 子图聚焦模式：默认只画枢纽概览图（几十个节点），点/搜某节点 → 只加载它的局部子图。
// 彻底避免一次渲染 500+ 节点导致卡死。
let curCenter=null;

function buildVisData(data, centerId){
  const nodes=data.nodes.map(n=>{
    const st=TYPE_STYLE[n.type]||{color:'#a0aec0',size:14,shape:'dot'};
    let label=n.label||n.id;
    if(n.badge!=null) label=label+`  (${n.badge})`;
    if(label.length>22) label=label.slice(0,21)+'…';
    const isCenter=n.id===centerId;
    return {id:n.id, label, title:`${n.type}: ${n.label}`,
      color:{background:st.color,border:isCenter?'#fff':'rgba(255,255,255,0.5)',
        highlight:{background:st.color,border:'#fff'}},
      size:isCenter?st.size+10:st.size, shape:st.shape,
      font:{color:'#e2e8f0',size:isCenter?13:11,face:'PingFang SC'},
      borderWidth:isCenter?3:1, _type:n.type, _full:n.label, _doc_id:n.doc_id};
  });
  const edges=data.edges
    .filter(e=>e.rel!=='BELONGS_TO')
    .map((e,i)=>({id:'e'+i, from:e.source,to:e.target,
      color:{color:REL_COLOR[e.rel]||'#555',opacity:0.5},
      width:e.rel==='SATISFIES'?0.8:1.4, arrows:{to:{enabled:true,scaleFactor:0.35}},
      smooth:false, _rel:e.rel}));
  return {nodes, edges};
}

function renderGraphData(data, centerId){
  const {nodes,edges}=buildVisData(data, centerId);
  if(!network){
    visNodes=new vis.DataSet(nodes);
    visEdges=new vis.DataSet(edges);
    network=new vis.Network(document.getElementById('graphCanvas'),{nodes:visNodes,edges:visEdges},{
      physics:{solver:'forceAtlas2Based',
        forceAtlas2Based:{gravitationalConstant:-60,centralGravity:0.015,springLength:120,springConstant:0.08,damping:0.8,avoidOverlap:0.2},
        stabilization:{enabled:true,iterations:120,updateInterval:25,fit:true},
        minVelocity:1.5, maxVelocity:30},
      layout:{improvedLayout:false},
      interaction:{hover:false,navigationButtons:false,keyboard:false,hideEdgesOnDrag:true,hideEdgesOnZoom:true},
      nodes:{shadow:false}, edges:{shadow:false},
    });
    network.once('stabilizationIterationsDone',()=>{ network.setOptions({physics:false}); network.fit({animation:false}); });
    network.on('click',params=>{
      if(params.nodes.length){ focusNode(params.nodes[0]); }
      else { closePanel(); hideGsResults(); }
    });
  }else{
    // 整体替换数据集（局部图节点少，瞬间完成）
    network.setOptions({physics:{enabled:true,stabilization:{enabled:true,iterations:120,fit:true}}});
    visNodes.clear(); visEdges.clear();
    visNodes.add(nodes); visEdges.add(edges);
    network.once('stabilizationIterationsDone',()=>{ network.setOptions({physics:false}); network.fit({animation:false}); });
  }
}

async function initGraph(){
  const hint=document.querySelector('.graph-hint');
  if(hint) hint.textContent='⏳ 加载概览图…';
  // 搜索索引用全量节点（轻量，仅 id/label/type），但渲染只用概览图
  fetch('/api/compliance/graph').then(r=>r.json()).then(d=>{
    allNodesIndex=d.nodes.map(n=>({id:n.id,type:n.type,label:n.label,alias:(n.alias||'')+' '+(n.basis||'')}));
  });
  const data=await fetch('/api/compliance/overview-graph').then(r=>r.json());
  renderGraphData(data, null);
  if(hint) hint.textContent='点击枢纽节点（法规/阶段/档案）展开其关联 · 或上方搜索任意节点';
}

// 聚焦某节点：加载它的局部子图并渲染（替换当前图）
async function focusNode(nodeId){
  curCenter=nodeId;
  const hint=document.querySelector('.graph-hint');
  if(hint) hint.textContent='⏳ 展开关联…';
  const data=await fetch('/api/compliance/subgraph/'+encodeURIComponent(nodeId)+'?hops=1').then(r=>r.json()).catch(()=>null);
  if(data && data.nodes && data.nodes.length){
    renderGraphData(data, nodeId);
    if(hint) hint.textContent=`已展开「${(allNodesIndex.find(x=>x.id===nodeId)||{}).label||nodeId}」的关联 · 点其它节点继续展开 · 「返回概览」回到全局`;
    showBackBtn(true);
  }
  showNodePanel(nodeId);
}

async function backToOverview(){
  closePanel(); showBackBtn(false); curCenter=null;
  const data=await fetch('/api/compliance/overview-graph').then(r=>r.json());
  renderGraphData(data, null);
  const hint=document.querySelector('.graph-hint');
  if(hint) hint.textContent='点击枢纽节点（法规/阶段/档案）展开其关联 · 或上方搜索任意节点';
}

function showBackBtn(show){
  let b=document.getElementById('gBackBtn');

    document.querySelector('.graph-wrap').appendChild(b);

}

function closePanel(){ document.getElementById('nodePanel').classList.remove('show'); }

async function showNodePanel(nodeId){
  const d=await fetch('/api/compliance/node/'+encodeURIComponent(nodeId)).then(r=>r.json()).catch(()=>null);
  if(!d){ return; }
  const n=d.node;
  const typeLabel={Stage:'注册阶段',Document:'文档/证据',Requirement:'审查要点',Regulation:'法规/标准',Dossier:'归档档案'}[n.type]||n.type;
  document.getElementById('npType').textContent=typeLabel;
  document.getElementById('npTitle').textContent=n.name||n.clause||n.basis||n.id;
  let sub='';
  if(n.type==='Requirement'){ sub=`<b style="color:#90cdf4">出自：</b>${esc(n.basis||'')}<br><b style="color:#90cdf4">条款：</b>${esc(n.clause||'')}`; if(n.detail||n.summary) sub+=`<br><span style="color:#64748b">${esc(n.detail||n.summary)}</span>`; }
  else if(n.type==='Stage'){ sub=esc(n.goal||''); }
  else if(n.type==='Document'){ sub=n.sub?('工作包：'+esc(n.sub)):''; }
  else if(n.type==='Regulation'){ sub='法规 / 行业标准 / 指导原则'; }
  else if(n.type==='Dossier'){ sub=esc(n.desc||'归档汇编（DHF/DMR/DHR/技术文档/NMPA）'); }
  document.getElementById('npSub').innerHTML=sub;
  // 可生成文档 → 生成按钮
  const gw=document.getElementById('npGenWrap');
  if(n.type==='Document'&&n.doc_id){ gw.innerHTML=`<button class="np-gen" onclick="genDoc('${n.doc_id}')">🚀 去注册路线图生成</button>`; }
  else gw.innerHTML='';
  // 邻居列表：审查要点(Requirement)按法规分组折叠，其余平铺
  const relLab={PRODUCES:'产出',SATISFIES:'满足',CITES:'引用',BELONGS_TO:'属于',ARCHIVED_IN:'归入'};
  const reqNbs=d.neighbors.filter(nb=>nb.type==='Requirement');
  const otherNbs=d.neighbors.filter(nb=>nb.type!=='Requirement');
  const nb1=(nb)=>{
    const c=(TYPE_STYLE[nb.type]||{}).color||'#888';
    return `<div class="np-nb" onclick="focusNode('${nb.id.replace(/'/g,"\\'")}')">
      <span class="nb-dot" style="background:${c}"></span>
      <span class="nb-lab">${esc(nb.label)}</span>
      <span class="nb-rel">${nb.dir==='out'?(relLab[nb.rel]||nb.rel):'被'+(relLab[nb.rel]||nb.rel)}</span></div>`;
  };
  let html=otherNbs.map(nb1).join('');
  if(reqNbs.length){
    // 按 basis(法规) 分组
    const groups={};
    reqNbs.forEach(nb=>{ const k=nb.basis||'其他'; (groups[k]=groups[k]||[]).push(nb); });
    html+=`<div style="margin-top:8px;font-size:10px;color:#64748b">满足的审查要点（共 ${reqNbs.length} 条，按法规分组）</div>`;
    html+=Object.entries(groups).map(([reg,items])=>`
      <div class="req-group">
        <div class="req-group-hd" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
          <span style="color:#90cdf4">▸</span> ${esc(reg)} <span style="color:#64748b">(${items.length})</span>
        </div>
        <div class="req-group-body" style="display:none">${items.map(nb1).join('')}</div>
      </div>`).join('');
  }
  document.getElementById('npNeighbors').innerHTML=html||'<div style="color:#64748b;font-size:11px">无关联</div>';
  document.getElementById('nodePanel').classList.add('show');
}

// 图谱内搜索
let gsTimer=null;
function onGraphSearch(){
  clearTimeout(gsTimer);
  gsTimer=setTimeout(()=>{
    const kw=(document.getElementById('graphSearch').value||'').trim().toLowerCase();
    const box=document.getElementById('gsResults');
    if(!kw){ hideGsResults(); return; }
    const hits=allNodesIndex.filter(n=>((n.label||'')+' '+(n.alias||'')).toLowerCase().includes(kw)).slice(0,20);
    if(!hits.length){ box.innerHTML='<div class="gs-item">无匹配节点</div>'; box.classList.add('show'); return; }
    const tl={Stage:'阶段',Document:'文档',Requirement:'法规要求',Regulation:'法规'};
    box.innerHTML=hits.map(h=>`<div class="gs-item" onclick="pickGs('${h.id.replace(/'/g,"\\'")}')">
      <span class="gi-type">${tl[h.type]||h.type}</span>${esc(h.label)}</div>`).join('');
    box.classList.add('show');
  },200);
}
function pickGs(id){ document.getElementById('graphSearch').value=''; hideGsResults(); focusNode(id); }
function hideGsResults(){ document.getElementById('gsResults').classList.remove('show'); }
